<!doctype html>
<html lang="%lang%" class="no-transitions">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Critical FOUC prevention styles - must be inline before any external CSS -->
    <style>
      /* Disable all transitions during initial theme setup to prevent FOUC */
      html.no-transitions,
      html.no-transitions *,
      html.no-transitions *::before,
      html.no-transitions *::after {
        transition: none !important;
        animation-duration: 0s !important;
      }
    </style>
    <!-- Fallback for JavaScript disabled - ensure page is visible -->
    <noscript>
      <style>
        html.theme-loaded:not(.hydration-complete) {
          visibility: visible !important;
        }
        html.no-transitions {
          transition: none !important;
        }
      </style>
    </noscript>
    <link rel="stylesheet" href="/styles/browser-overrides.css" />
    <script>
      // Prevent FOUC (Flash of Unstyled Content) by setting theme immediately
      // This runs before any framework code, ensuring the correct theme is applied
      (function () {
        try {
          const THEME_KEY = 'theme';
          const stored = localStorage.getItem(THEME_KEY);
          const sessionTheme = sessionStorage.getItem('applied-theme');

          // Use session theme if available for fastest retrieval
          if (sessionTheme && ['light', 'dark'].includes(sessionTheme)) {
            document.documentElement.setAttribute('data-theme', sessionTheme);
            // theme-loaded will be added by Svelte after hydration
            // to prevent layout shift visibility
            document.documentElement.classList.add('theme-loaded');
            return;
          }

          // Validate stored value
          const validThemes = ['light', 'dark', 'system'];
          const isValid = stored && validThemes.includes(stored);
          const theme = isValid ? stored : 'system';

          // Determine actual theme to apply
          let actualTheme = theme;
          if (theme === 'system') {
            try {
              const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              actualTheme = prefersDark ? 'dark' : 'light';
            } catch (e) {
              // Fallback to light if matchMedia fails
              actualTheme = 'light';
            }
          }

          // Apply theme immediately
          document.documentElement.setAttribute('data-theme', actualTheme);
          document.documentElement.classList.add('theme-loaded');

          // Store in sessionStorage for faster retrieval on subsequent page loads
          sessionStorage.setItem('applied-theme', actualTheme);

          // Note: no-transitions class is removed by Svelte after hydration completes
        } catch (e) {
          // Fail silently and let CSS defaults handle theme
          console.warn('Failed to initialize theme:', e);
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('theme-loaded');
          document.documentElement.classList.remove('no-transitions');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
