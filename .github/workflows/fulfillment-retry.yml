name: Fulfillment retry sweep

# Retries paid orders that never reached their fulfillment provider.
#
# This belongs on a Cloudflare Cron Trigger, but @sveltejs/adapter-cloudflare
# emits a fetch-only `_worker.js`, so there is no `scheduled()` handler for a
# trigger to call. The sweep is an authenticated HTTP endpoint instead, and
# this workflow is what calls it. See docs/FULFILLMENT_RELAY.md.
#
# GitHub's scheduler is best-effort and can run late under load. That is
# acceptable here: the backoff is measured in minutes to hours, and a late
# sweep delays a retry rather than losing it.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# A slow sweep must not have a second one started on top of it.
concurrency:
  group: fulfillment-retry
  cancel-in-progress: false

jobs:
  sweep:
    name: Retry due relays
    runs-on: ubuntu-latest
    steps:
      - name: Call the sweep endpoint
        env:
          SWEEP_URL: ${{ secrets.FULFILLMENT_RETRY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SWEEP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "FULFILLMENT_RETRY_URL or CRON_SECRET is not set — skipping."
            echo "See docs/FULFILLMENT_RELAY.md to configure them."
            exit 0
          fi

          response=$(mktemp)
          status=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --output "${response}" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${SWEEP_URL}") || {
              echo "Sweep failed with HTTP ${status:-000}:"
              cat "${response}"
              exit 1
            }

          echo "HTTP ${status}"
          cat "${response}"
