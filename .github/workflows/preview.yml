name: Preview deploy

# Manual, on purpose. A preview deploy overwrites the shared `hermes-preview`
# Worker and migrates the shared preview D1 database, so the last branch to run
# wins. That is a maintainer's decision, not something every PR should do by
# itself. Pick the branch in the "Run workflow" dialog.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to comment the preview URL on (optional)
        required: false
        type: string

jobs:
  preview:
    name: Deploy to hermes-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Apply D1 migrations (preview)
        run: npm run db:migrate:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --env preview 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the PR
        if: inputs.pr != '' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          REF: ${{ github.ref_name }}
        run: |
          gh pr comment "${{ inputs.pr }}" --repo "$GITHUB_REPOSITORY" \
            --body "Preview deployed from \`$REF\`: $URL"
