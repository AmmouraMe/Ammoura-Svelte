name: CI

# Checks run on every pull request, drafts included — an early draft PR is
# supposed to give CI somewhere to run (see CLAUDE.md, Contribution Workflow).
# The deploy job below only runs on a push to `main`, after the checks pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Neither job writes to the repository. Deploys authenticate to Cloudflare with
# the repository secrets below, not with GITHUB_TOKEN.
permissions:
  contents: read

# One run per ref. A new commit on a PR cancels the older run; pushes to `main`
# queue instead, so two deploys never overlap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run lint` is `prettier --check . && eslint .`, so formatting is
      # covered here and does not need a step of its own.
      - name: Lint
        run: npm run lint

      - name: Type and Svelte check
        run: npm run check

      # Coverage thresholds live in vitest.config.ts and fail the run on their own.
      - name: Test with coverage
        run: npm run test:coverage

      # The README coverage badges are generated, never hand-edited. Regenerate
      # them from this run and fail if the committed values disagree.
      - name: README coverage badges are current
        run: |
          npm run badges:update
          if ! git diff --exit-code -- README.md; then
            echo "::error file=README.md::Coverage badges are stale. Run 'npm run badges' and commit README.md."
            exit 1
          fi

  deploy:
    name: Migrate and deploy
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Production migrations run here and nowhere else — never from a laptop.
      # If this step fails the job stops before `wrangler deploy`, so the
      # previously deployed Worker keeps serving.
      - name: Apply D1 migrations (production)
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
